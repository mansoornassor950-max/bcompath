name: Build BComPath APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'

    - name: Fix Icon and Create Adaptive Icon
      run: |
        cd app/src/main/res/drawable
        # Force rename the 3eb... photo directly
        mv 3eb* ic_launcher_bg.jpg 2>/dev/null || true
        # Also copy it to ic_launcher.jpg
        cp -f ic_launcher_bg.jpg ic_launcher.jpg 2>/dev/null || true
        # Clean up any leftover files starting with numbers or containing ~
        rm -f *~* [0-9]* 2>/dev/null || true
        # Create full-circle adaptive icon configuration
        mkdir -p ../drawable-v26
        cat << 'EOF' > ../drawable-v26/ic_launcher.xml
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_launcher_bg" />
            <foreground android:drawable="@android:color/transparent" />
        </adaptive-icon>
        EOF
        echo "=== Files in drawable after cleanup: ==="
        ls -la

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload BComPath APK
      uses: actions/upload-artifact@v4
      with:
        name: BComPath-KU-BCom-Study-App
        path: app/build/outputs/apk/debug/app-debug.apk
