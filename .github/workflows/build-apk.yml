name: Build BComPath APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'

    - name: Fix Icon Filename
      run: |
        cd app/src/main/res/drawable
        find . -maxdepth 1 -type f ! -name ".gitkeep" ! -name "ic_launcher.*" | while read -r file; do
          echo "Renaming illegal file $file to ic_launcher.jpg"
          mv "$file" ic_launcher.jpg
          break
        done
        ls -la

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload BComPath APK
      uses: actions/upload-artifact@v4
      with:
        name: BComPath-KU-BCom-Study-App
        path: app/build/outputs/apk/debug/app-debug.apk
